name: ecobrigadasupabase
description: EcoBrigada 3.0 integrado a la base Supabase original.
version: 3.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.2
  url_launcher: ^6.3.3
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  image: ^4.5.4
  uuid: ^4.5.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  file_saver: ^0.4.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/ensamblaje/