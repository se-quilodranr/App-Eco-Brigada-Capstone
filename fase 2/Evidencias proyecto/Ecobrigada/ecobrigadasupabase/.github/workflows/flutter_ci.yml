name: Validación Flutter
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas unitarias
        run: flutter test
